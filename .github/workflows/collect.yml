name: Collect jobs

on:
  schedule:
    - cron: "0 5 * * *"    # 07:00 Berlin (summer)
    - cron: "0 10 * * *"   # 12:00 Berlin
    - cron: "0 15 * * *"   # 17:00 Berlin
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          PROBE_LIMIT: "120"
        run: python collector.py

      - name: Save results
        run: |
          git config user.name "job-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out data
          git diff --cached --quiet || git commit -m "Jobs collected $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
